<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1920">
    <meta name="template:media-height" content="1080">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            position: relative;
        }

        /* Beautiful Dynamic Mesh Gradient Background */
        .mesh-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 40% 20%, hsla(258,100%,74%,0.4) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.4) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(335,100%,76%,0.4) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,0.4) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,0.4) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,0.4) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,0.4) 0px, transparent 50%);
            z-index: 1;
        }

        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 150px;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 45px 70px;
            width: 100%;
            max-width: 1200px;
            min-height: 280px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 28px;
            position: relative;
            overflow: hidden;
        }

        /* Highlight element */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #6366f1, #3b82f6, #ec4899);
        }

        .title {
            font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', 'Inter', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            line-height: 1.3;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: rgba(99, 102, 241, 0.6);
            border-radius: 2px;
            margin: 0 auto;
        }

        .content {
            font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            font-size: 26px;
            color: #e2e8f0;
            text-align: center;
            line-height: 1.6;
            font-weight: 500;
            font-style: normal;
            max-width: 950px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .footer {
            position: absolute;
            bottom: 60px;
            left: 100px;
            right: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .brand-badge span {
            color: #3b82f6;
        }

        .page-number {
            font-size: 32px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <div class="mesh-gradient"></div>
    <div class="noise-overlay"></div>

    <div class="container">
        <div class="glass-card">
            <div class="title">{{title}}</div>
            <div class="divider"></div>
            <div class="content">{{text}}</div>
        </div>
    </div>

    <div style="position: absolute; bottom: 40px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: center; z-index: 100; font-family: 'Outfit', -apple-system, sans-serif;">
        <div style="font-size: 32px; font-weight: 500; color: rgba(255, 255, 255, 0.7);">By NotebookE</div>
        <div style="font-size: 36px; font-weight: 700; color: #ffffff; letter-spacing: -1px;">Note<span style="color: #6366f1;">bookE</span></div>
    </div>
</body>
</html>
