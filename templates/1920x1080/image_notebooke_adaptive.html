<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="template:media-width" content="1536">
  <meta name="template:media-height" content="1024">
  <meta name="viewport" content="width=1920,height=1080">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
    body {
      --accent: {{accent=#2dd4bf}};
      --accent-2: {{accent_2=#38bdf8}};
      --ink: {{ink=#f8fafc}};
      --muted: {{muted=#cbd5e1}};
      --bg: {{background=#07111f}};
      --panel: {{panel=#0f172a}};
      position: relative;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Be Vietnam Pro", Arial, sans-serif;
    }
    .media { position: absolute; inset: 0; overflow: hidden; background: var(--panel); }
    .media img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.015); }
    .veil {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(3,9,19,.96) 0%, rgba(3,9,19,.68) 37%, rgba(3,9,19,.14) 72%),
        linear-gradient(0deg, rgba(3,9,19,.92) 0%, transparent 46%);
    }
    .grain { position: absolute; inset: 0; opacity: .09; background-image: radial-gradient(rgba(255,255,255,.7) .7px, transparent .7px); background-size: 7px 7px; mix-blend-mode: soft-light; }
    .topbar { position: absolute; top: 58px; left: 72px; right: 72px; display: flex; align-items: center; justify-content: space-between; z-index: 4; }
    .brand { display: flex; align-items: center; gap: 15px; font-size: 23px; font-weight: 750; letter-spacing: .08em; }
    .mark { width: 30px; height: 30px; border: 6px solid var(--accent); border-left-color: transparent; transform: rotate(45deg); border-radius: 7px; }
    .counter { color: var(--muted); font-size: 20px; font-weight: 650; letter-spacing: .16em; }
    .content { position: absolute; z-index: 3; left: 80px; top: 205px; width: 760px; }
    .purpose { color: var(--accent); font-size: 20px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 24px; }
    .title { font-size: 70px; line-height: 1.06; letter-spacing: -.045em; font-weight: 780; text-wrap: balance; text-shadow: 0 4px 30px rgba(0,0,0,.35); }
    .keywords { margin-top: 28px; color: var(--muted); font-size: 21px; font-weight: 540; letter-spacing: .035em; }
    .caption {
      position: absolute; z-index: 5; left: 80px; bottom: 98px;
      max-width: 1180px; min-height: 92px; display: flex; align-items: center;
      padding: 21px 30px 23px; border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px; background: rgba(4,12,24,.74); backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,.3);
      font-size: 38px; line-height: 1.22; font-weight: 680; letter-spacing: -.015em;
    }
    .caption::before { content: ""; width: 6px; align-self: stretch; margin-right: 20px; border-radius: 9px; background: linear-gradient(var(--accent), var(--accent-2)); }
    .progress { position: absolute; z-index: 5; left: 80px; right: 80px; bottom: 49px; height: 3px; background: rgba(255,255,255,.16); }
    .progress span { display: block; width: 34%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

    body.theme-light .veil { background: linear-gradient(90deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.7) 38%, rgba(255,255,255,.08) 75%), linear-gradient(0deg, rgba(255,255,255,.88), transparent 48%); }
    body.theme-light .grain { opacity: .035; mix-blend-mode: multiply; }
    body.theme-light .caption { color: var(--ink); background: color-mix(in srgb, var(--panel) 88%, transparent); border-color: color-mix(in srgb, var(--ink) 14%, transparent); box-shadow: 0 24px 70px rgba(40,48,56,.14); }
    body.theme-light .counter { color: var(--muted); }
    body.theme-light .title { text-shadow: 0 3px 24px rgba(255,255,255,.55); }

    body.layout-split .media { left: 49%; }
    body.layout-split .veil { background: linear-gradient(90deg, #07111f 0 47%, rgba(7,17,31,.96) 52%, rgba(7,17,31,.08) 78%); }
    body.layout-split .content { top: 240px; width: 720px; }
    body.layout-split .caption { max-width: 790px; }

    body.layout-diagram .media { inset: 155px 95px 225px 860px; border: 1px solid rgba(255,255,255,.16); border-radius: 26px; box-shadow: 0 30px 90px rgba(0,0,0,.42); }
    body.layout-diagram .media img { object-fit: contain; background: #0b1727; }
    body.layout-diagram .veil { background: radial-gradient(circle at 68% 45%, rgba(45,212,191,.13), transparent 36%), linear-gradient(90deg, #07111f 0 43%, rgba(7,17,31,.52)); }
    body.layout-diagram .content { top: 235px; width: 700px; }
    body.layout-diagram .caption { max-width: 760px; }

    body.layout-timeline .media { inset: 235px 80px 280px; border-radius: 28px; }
    body.layout-timeline .veil { background: linear-gradient(180deg, #07111f 0 16%, rgba(7,17,31,.06) 42% 66%, #07111f 88%); }
    body.layout-timeline .content { top: 132px; left: 120px; width: 1500px; }
    body.layout-timeline .title { font-size: 60px; }
    body.layout-timeline .purpose { margin-bottom: 12px; }
    body.layout-timeline .caption { left: 280px; right: 280px; max-width: none; justify-content: center; text-align: center; }

    body.layout-comparison .media { inset: 145px 80px 245px 760px; border-radius: 28px; }
    body.layout-comparison .veil { background: linear-gradient(90deg, #07111f 0 36%, rgba(7,17,31,.82) 50%, rgba(7,17,31,.15) 76%), linear-gradient(0deg, #07111f, transparent 45%); }
    body.layout-comparison .content { top: 220px; width: 630px; }
    body.layout-comparison .title { font-size: 62px; }
    body.layout-comparison .caption { max-width: 760px; }

    body.layout-focus .veil { background: radial-gradient(circle at 62% 42%, rgba(14,165,233,.05), rgba(3,9,19,.58) 54%, rgba(3,9,19,.95)); }
    body.layout-focus .content { left: 250px; top: 260px; width: 1420px; text-align: center; }
    body.layout-focus .title { font-size: 88px; }
    body.layout-focus .keywords { font-size: 24px; }
    body.layout-focus .caption { left: 330px; right: 330px; max-width: none; justify-content: center; text-align: center; }
    body.layout-process .media { inset: 165px 80px 250px 820px; border-radius: 28px; }
    body.layout-process .media img { object-position: 62% center; }
    body.layout-process .veil { background: linear-gradient(90deg, #07111f 0 40%, rgba(7,17,31,.6) 62%, rgba(7,17,31,.1)); }
    body.layout-process .content { top: 240px; width: 650px; }
    body.layout-process .title { font-size: 64px; }
    body.layout-process .caption { max-width: 780px; }
    body.layout-metrics .media { inset: 145px 90px 245px; border-radius: 28px; }
    body.layout-metrics .veil { background: linear-gradient(180deg, #07111f 0 15%, rgba(7,17,31,.04) 43%, #07111f 87%); }
    body.layout-metrics .content { left: 120px; top: 190px; width: 1420px; }
    body.layout-metrics .title { font-size: 72px; }
    body.layout-metrics .caption { left: 250px; right: 250px; max-width: none; }
    body.theme-light .veil { background: linear-gradient(90deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.7) 38%, rgba(255,255,255,.08) 75%), linear-gradient(0deg, rgba(255,255,255,.88), transparent 48%); }
    body.theme-light.layout-diagram .veil,
    body.theme-light.layout-comparison .veil,
    body.theme-light.layout-process .veil { background: linear-gradient(90deg, var(--bg) 0 42%, color-mix(in srgb, var(--bg) 72%, transparent) 60%, transparent 82%); }
    body.theme-light.layout-timeline .veil,
    body.theme-light.layout-metrics .veil { background: linear-gradient(180deg, var(--bg) 0 15%, transparent 40% 66%, var(--bg) 89%); }
    body.theme-light.layout-focus .veil { background: radial-gradient(circle at 62% 42%, transparent, color-mix(in srgb, var(--bg) 62%, transparent) 58%, var(--bg)); }
  </style>
</head>
<body class="theme-{{tone=dark}} layout-{{layout=cinematic}}">
  <div class="media"><img src="{{image}}" alt=""></div>
  <div class="veil"></div><div class="grain"></div>
  <div class="topbar"><div class="brand"><span class="mark"></span>{{brand=NotebookE}}</div><div class="counter">{{scene_number=01}} / {{total_scenes=01}}</div></div>
  <main class="content"><div class="purpose">{{purpose=Giải thích chuyên sâu}}</div><div class="title">{{title}}</div><div class="keywords">{{keywords}}</div></main>
  <div class="caption">{{text}}</div>
  <div class="progress"><span></span></div>
</body>
</html>
