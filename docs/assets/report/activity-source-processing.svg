<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1800" viewBox="0 0 2300 1800">
  <defs>
    <style>
      .page-title { font: 700 30px "Times New Roman", serif; fill: #111827; text-anchor: middle; }
      .lane-title { font: 700 25px "Times New Roman", serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .node-text { font: 600 21px "Times New Roman", serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 18px "Times New Roman", serif; fill: #334155; text-anchor: middle; }
      .label { font: 700 18px "Times New Roman", serif; fill: #334155; }
      .action { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .api { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .worker { fill: #f0fdf4; stroke: #15803d; stroke-width: 2.5; }
      .decision { fill: #fffbeb; stroke: #b45309; stroke-width: 2.5; }
      .error { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2.5; }
      .store { fill: #f8fafc; stroke: #64748b; stroke-width: 2.5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .async { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 10 7; marker-end: url(#blueArrow); }
      .status { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#grayArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#334155" stroke-width="1.6"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="2300" height="1800" fill="#ffffff"/>
  <text class="page-title" x="1150" y="44">QUY TRÌNH THÊM VÀ XỬ LÝ NGUỒN TÀI LIỆU</text>

  <!-- Swimlanes -->
  <rect x="40" y="70" width="2220" height="1655" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <rect x="40" y="70" width="480" height="90" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
  <rect x="520" y="70" width="700" height="90" fill="#eff6ff" stroke="#111827" stroke-width="2"/>
  <rect x="1220" y="70" width="1040" height="90" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
  <rect x="40" y="160" width="480" height="1565" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="520" y="160" width="700" height="1565" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1220" y="160" width="1040" height="1565" fill="#fcfffd" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="lane-title" x="280" y="116">NGƯỜI DÙNG</text>
  <text class="lane-title" x="870" y="116">FASTAPI</text>
  <text class="lane-title" x="1740" y="116">BACKGROUND WORKER</text>

  <!-- User lane -->
  <circle cx="280" cy="205" r="18" fill="#111827"/>
  <rect class="action" x="95" y="250" width="370" height="82" rx="18"/>
  <text class="node-text" x="280" y="282">Chọn chức năng</text>
  <text class="node-text" x="280" y="308">Thêm nguồn</text>
  <path class="flow" d="M280 223 L280 250"/>

  <rect class="action" x="85" y="380" width="390" height="108" rx="18"/>
  <text class="node-text" x="280" y="410">Chọn tệp, nhập văn bản</text>
  <text class="node-text" x="280" y="438">hoặc URL</text>
  <text class="node-text" x="280" y="466">Chọn sổ tay và tùy chọn xử lý</text>
  <path class="flow" d="M280 332 L280 380"/>

  <rect class="action" x="85" y="810" width="390" height="94" rx="18"/>
  <text class="node-text" x="280" y="842">Hiển thị nguồn với</text>
  <text class="node-text" x="280" y="870">trạng thái chờ xử lý</text>

  <rect class="action" x="85" y="1010" width="390" height="94" rx="18"/>
  <text class="node-text" x="280" y="1042">Theo dõi trạng thái</text>
  <text class="node-text" x="280" y="1070">queued, running, completed, failed</text>
  <path class="flow" d="M280 904 L280 1010"/>

  <rect class="action" x="85" y="1540" width="390" height="100" rx="18"/>
  <text class="node-text" x="280" y="1572">Xem nguồn đã xử lý</text>
  <text class="node-text" x="280" y="1600">hoặc thông báo lỗi</text>
  <circle cx="280" cy="1680" r="21" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <circle cx="280" cy="1680" r="13" fill="#111827"/>
  <path class="flow" d="M280 1640 L280 1659"/>

  <!-- API lane -->
  <rect class="api" x="645" y="380" width="450" height="108" rx="18"/>
  <text class="node-text" x="870" y="420">Tiếp nhận yêu cầu</text>
  <text class="node-text" x="870" y="450">và kiểm tra dữ liệu đầu vào</text>
  <path class="flow" d="M475 434 L645 434"/>

  <polygon class="decision" points="870,530 970,600 870,670 770,600"/>
  <text class="node-text" x="870" y="590">Dữ liệu</text>
  <text class="node-text" x="870" y="617">hợp lệ?</text>
  <path class="flow" d="M870 488 L870 530"/>

  <rect class="error" x="540" y="705" width="280" height="80" rx="16"/>
  <text class="node-text" x="680" y="735">Trả lỗi kiểm tra</text>
  <text class="node-text" x="680" y="761">dữ liệu đầu vào</text>
  <path class="flow" d="M770 600 L680 600 L680 705"/>
  <text class="label" x="710" y="588">Không</text>
  <path class="status" d="M540 745 L495 745 L495 1590 L475 1590"/>

  <rect class="api" x="850" y="705" width="345" height="88" rx="18"/>
  <text class="node-text" x="1022" y="735">Tạo bản ghi Source</text>
  <text class="node-text" x="1022" y="763">với tiêu đề Processing...</text>
  <path class="flow" d="M870 670 L870 690 L1022 690 L1022 705"/>
  <text class="label" x="890" y="689">Có</text>

  <rect class="store" x="960" y="815" width="190" height="88" rx="8"/>
  <ellipse cx="1055" cy="815" rx="95" ry="18" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text class="node-text" x="1055" y="847">Lưu Source và</text>
  <text class="node-text" x="1055" y="874">liên kết Notebook</text>
  <path class="flow" d="M1022 793 L1022 815"/>

  <rect class="api" x="620" y="930" width="500" height="90" rx="18"/>
  <text class="node-text" x="870" y="962">Gửi lệnh process_source</text>
  <text class="node-text" x="870" y="990">vào hàng đợi Surreal Commands</text>
  <path class="flow" d="M960 875 L870 875 L870 930"/>

  <rect class="api" x="650" y="1070" width="440" height="88" rx="18"/>
  <text class="node-text" x="870" y="1100">Trả source_id và</text>
  <text class="node-text" x="870" y="1128">trạng thái queued</text>
  <path class="flow" d="M870 1020 L870 1070"/>
  <path class="flow" d="M650 1114 L510 1114 L510 857 L475 857"/>

  <!-- Worker lane: process_source -->
  <rect class="worker" x="1320" y="930" width="390" height="90" rx="18"/>
  <text class="node-text" x="1515" y="962">Nhận và thực thi</text>
  <text class="node-text" x="1515" y="990">lệnh process_source</text>
  <path class="async" d="M1120 975 L1320 975"/>
  <text class="small" x="1220" y="955">bất đồng bộ</text>

  <rect class="worker" x="1320" y="1070" width="390" height="90" rx="18"/>
  <text class="node-text" x="1515" y="1102">Trích xuất nội dung</text>
  <text class="node-text" x="1515" y="1130">bằng content-core</text>
  <path class="flow" d="M1515 1020 L1515 1070"/>

  <polygon class="decision" points="1515,1200 1620,1270 1515,1340 1410,1270"/>
  <text class="node-text" x="1515" y="1260">Có nội dung</text>
  <text class="node-text" x="1515" y="1287">hợp lệ?</text>
  <path class="flow" d="M1515 1160 L1515 1200"/>

  <rect class="error" x="1250" y="1380" width="300" height="86" rx="16"/>
  <text class="node-text" x="1400" y="1411">Đánh dấu command</text>
  <text class="node-text" x="1400" y="1439">failed và lưu lỗi</text>
  <path class="flow" d="M1410 1270 L1400 1270 L1400 1380"/>
  <text class="label" x="1342" y="1257">Không</text>
  <path class="status" d="M1250 1423 L1120 1423 L1120 1485 L475 1485 L475 1590"/>

  <rect class="worker" x="1700" y="1225" width="430" height="90" rx="18"/>
  <text class="node-text" x="1915" y="1257">Lưu full_text và metadata</text>
  <text class="node-text" x="1915" y="1285">vào bản ghi Source</text>
  <path class="flow" d="M1620 1270 L1700 1270"/>
  <text class="label" x="1645" y="1257">Có</text>

  <polygon class="decision" points="1915,1360 2020,1430 1915,1500 1810,1430"/>
  <text class="node-text" x="1915" y="1420">Bật tạo</text>
  <text class="node-text" x="1915" y="1447">embedding?</text>
  <path class="flow" d="M1915 1315 L1915 1360"/>

  <rect class="worker" x="1700" y="1540" width="430" height="86" rx="18"/>
  <text class="node-text" x="1915" y="1570">Gửi lệnh embed_source</text>
  <text class="node-text" x="1915" y="1598">vào hàng đợi riêng</text>
  <path class="flow" d="M1915 1500 L1915 1540"/>
  <text class="label" x="1935" y="1525">Có</text>

  <rect class="worker" x="1270" y="1510" width="360" height="100" rx="18"/>
  <text class="node-text" x="1450" y="1540">Chạy transformation</text>
  <text class="node-text" x="1450" y="1568">được chọn và hoàn tất</text>
  <text class="node-text" x="1450" y="1596">process_source</text>
  <path class="flow" d="M1810 1430 L1670 1430 L1670 1560 L1630 1560"/>
  <text class="label" x="1725" y="1417">Không</text>
  <path class="flow" d="M1700 1583 L1630 1583"/>
  <path class="status" d="M1270 1560 L1125 1560 L1125 1590 L475 1590"/>

  <!-- Embedding sub-job note -->
  <rect x="1660" y="1650" width="520" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.7"/>
  <text class="small" x="1920" y="1678">embed_source tiếp tục: chia đoạn → sinh vector theo batch</text>
  <text class="small" x="1920" y="1703">→ bulk insert các bản ghi source_embedding</text>
  <path class="async" d="M1915 1626 L1915 1650"/>

  <!-- Polling status connection -->
  <path class="status" d="M650 1115 L525 1115 L525 1057 L475 1057"/>

  <!-- Legend -->
  <rect x="610" y="1740" width="1080" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <line class="flow" x1="650" y1="1762" x2="730" y2="1762"/><text class="small" x="825" y="1769">Luồng xử lý</text>
  <line class="async" x1="945" y1="1762" x2="1025" y2="1762"/><text class="small" x="1145" y="1769">Gửi tác vụ bất đồng bộ</text>
  <line class="status" x1="1370" y1="1762" x2="1450" y2="1762"/><text class="small" x="1550" y="1769">Cập nhật trạng thái</text>
</svg>
