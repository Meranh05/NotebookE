<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1700" viewBox="0 0 3000 1700">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#111"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .title { font-size:39px; font-weight:700; text-anchor:middle; }
      .server { fill:#fff; stroke:#111; stroke-width:3; }
      .server-top { fill:#ededed; stroke:#111; stroke-width:3; }
      .node { fill:#f7f7f7; stroke:#111; stroke-width:2.5; }
      .optional { fill:#fff; stroke:#555; stroke-width:2.5; stroke-dasharray:10 7; }
      .stereo { font-size:19px; font-style:italic; text-anchor:middle; }
      .node-title { font-size:26px; font-weight:700; text-anchor:middle; }
      .detail { font-size:19px; text-anchor:middle; }
      .flow { fill:none; stroke:#111; stroke-width:3; marker-end:url(#arrow); }
      .async { fill:none; stroke:#111; stroke-width:3; stroke-dasharray:11 8; marker-end:url(#arrow); }
      .ai { fill:none; stroke:#111; stroke-width:3; stroke-dasharray:3 8; marker-end:url(#arrow); }
      .label { font-size:19px; text-anchor:middle; }
      .caption { font-size:23px; font-style:italic; text-anchor:middle; }
      .component-tab { fill:#fff; stroke:#111; stroke-width:2; }
    </style>
  </defs>
  <rect width="3000" height="1700" fill="#fff"/>
  <text x="1500" y="62" class="title">SƠ ĐỒ TRIỂN KHAI HỆ THỐNG NOTEBOOKE</text>

  <!-- User and browser outside server -->
  <circle cx="180" cy="325" r="31" fill="#fff" stroke="#111" stroke-width="3"/><line x1="180" y1="356" x2="180" y2="430" stroke="#111" stroke-width="3"/><line x1="125" y1="383" x2="235" y2="383" stroke="#111" stroke-width="3"/><line x1="180" y1="430" x2="135" y2="475" stroke="#111" stroke-width="3"/><line x1="180" y1="430" x2="225" y2="475" stroke="#111" stroke-width="3"/><text x="180" y="520" class="node-title">Người dùng</text>
  <rect x="60" y="610" width="240" height="165" class="node"/><rect x="60" y="610" width="240" height="32" fill="#e9e9e9" stroke="#111" stroke-width="2.5"/><circle cx="83" cy="626" r="5" fill="#fff" stroke="#111"/><circle cx="103" cy="626" r="5" fill="#fff" stroke="#111"/><circle cx="123" cy="626" r="5" fill="#fff" stroke="#111"/><text x="180" y="695" class="node-title">Trình duyệt</text><text x="180" y="735" class="detail">Web Browser</text>

  <!-- Server node -->
  <rect x="440" y="175" width="2040" height="1190" class="server"/>
  <polygon points="440,175 475,140 2515,140 2480,175" class="server-top"/>
  <polygon points="2480,175 2515,140 2515,1330 2480,1365" fill="#f5f5f5" stroke="#111" stroke-width="3"/>
  <text x="500" y="225" class="stereo" text-anchor="start">&lt;&lt;device / Docker host&gt;&gt;</text>
  <text x="500" y="270" class="node-title" text-anchor="start">Máy chủ NotebookE</text>

  <!-- Frontend -->
  <g>
    <rect x="590" y="350" width="470" height="250" class="node"/><rect x="610" y="375" width="28" height="55" class="component-tab"/><rect x="622" y="389" width="28" height="55" class="component-tab"/>
    <text x="825" y="392" class="stereo">&lt;&lt;container&gt;&gt;</text><text x="825" y="445" class="node-title">Next.js Frontend</text><line x1="640" y1="472" x2="1010" y2="472" stroke="#999" stroke-width="1.5"/><text x="825" y="515" class="detail">Cổng nội bộ: 3000</text><text x="825" y="555" class="detail">React · TypeScript · API proxy</text>
  </g>

  <!-- API -->
  <g>
    <rect x="1220" y="350" width="470" height="250" class="node"/><rect x="1240" y="375" width="28" height="55" class="component-tab"/><rect x="1252" y="389" width="28" height="55" class="component-tab"/>
    <text x="1455" y="392" class="stereo">&lt;&lt;container&gt;&gt;</text><text x="1455" y="445" class="node-title">FastAPI Backend</text><line x1="1270" y1="472" x2="1640" y2="472" stroke="#999" stroke-width="1.5"/><text x="1455" y="515" class="detail">Cổng: 5055</text><text x="1455" y="555" class="detail">REST · SSE · LangGraph</text>
  </g>

  <!-- Database -->
  <g>
    <ellipse cx="2110" cy="375" rx="200" ry="48" fill="#f7f7f7" stroke="#111" stroke-width="2.5"/><path d="M1910,375 V560 C1910,625 2310,625 2310,560 V375" fill="#f7f7f7" stroke="#111" stroke-width="2.5"/><path d="M1910,470 C1910,535 2310,535 2310,470" fill="none" stroke="#777" stroke-width="1.7"/>
    <text x="2110" y="450" class="node-title">SurrealDB</text><text x="2110" y="495" class="detail">Cổng: 8000</text><text x="2110" y="535" class="detail">Dữ liệu · Vector · Command Queue</text>
  </g>

  <!-- Local AI -->
  <g>
    <rect x="590" y="820" width="470" height="260" class="optional"/><text x="825" y="860" class="stereo">&lt;&lt;optional container / LAN&gt;&gt;</text>
    <path d="M715,910 h45 l18,-20 h72 l18,20 h45 v58 h-198 z" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="742" cy="940" r="8" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="774" cy="940" r="8" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="806" cy="940" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="825" y="1010" class="node-title">Local AI Model / Ollama</text><text x="825" y="1050" class="detail">Cổng thường dùng: 11434</text>
  </g>

  <!-- Worker -->
  <g>
    <rect x="1220" y="820" width="470" height="260" class="node"/><rect x="1240" y="845" width="28" height="55" class="component-tab"/><rect x="1252" y="859" width="28" height="55" class="component-tab"/>
    <text x="1455" y="862" class="stereo">&lt;&lt;service&gt;&gt;</text><text x="1455" y="925" class="node-title">Background Worker</text><line x1="1270" y1="952" x2="1640" y2="952" stroke="#999" stroke-width="1.5"/><text x="1455" y="995" class="detail">Xử lý nguồn · embedding</text><text x="1455" y="1035" class="detail">Podcast · Video · tác vụ nền</text>
  </g>

  <!-- Media storage -->
  <g>
    <path d="M1900,845 h420 l45,45 v190 h-465 z" class="node"/><path d="M2320,845 v45 h45" fill="none" stroke="#111" stroke-width="2.5"/>
    <text x="2125" y="915" class="stereo">&lt;&lt;volume / filesystem&gt;&gt;</text><text x="2125" y="965" class="node-title">Vùng lưu tệp</text><text x="2125" y="1005" class="detail">Podcast (.mp3)</text><text x="2125" y="1042" class="detail">Video (.mp4) và tệp trung gian</text>
  </g>

  <!-- Cloud AI outside server -->
  <g>
    <rect x="2610" y="470" width="330" height="350" class="node"/>
    <path d="M2665,600 C2665,555 2710,540 2740,560 C2760,510 2840,520 2850,575 C2895,568 2920,605 2900,640 H2695 C2675,640 2665,625 2665,600 Z" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <text x="2775" y="705" class="stereo">&lt;&lt;external service&gt;&gt;</text><text x="2775" y="755" class="node-title">Nhà cung cấp AI</text><text x="2775" y="792" class="detail">LLM · Embedding · TTS · STT</text>
  </g>

  <!-- Connections -->
  <line x1="300" y1="695" x2="580" y2="500" class="flow"/><text x="420" y="570" class="label">HTTP / HTTPS</text>
  <line x1="1060" y1="475" x2="1210" y2="475" class="flow"/><text x="1135" y="452" class="label">REST / SSE</text>
  <line x1="1690" y1="475" x2="1900" y2="475" class="flow"/><text x="1795" y="452" class="label">SurrealQL / WebSocket</text>
  <path d="M1455,600 V700 H2110 V620" class="async"/><text x="1760" y="682" class="label">Ghi công việc và trạng thái</text>
  <path d="M1690,925 H1840 V650 H1910" class="async"/>
  <line x1="1690" y1="1010" x2="1890" y2="1010" class="flow"/><text x="1790" y="988" class="label">Lưu tệp kết quả</text>
  <path d="M1220,950 H1070" class="ai"/><text x="1145" y="928" class="label">AI cục bộ</text>
  <path d="M1690,870 V760 H2520 V690 H2600" class="ai"/><text x="2180" y="742" class="label">HTTPS đến AI cloud</text>
  <path d="M1690,350 V300 H2775 V460" class="ai"/>
  <path d="M1690,575 H1760 V1150 H2125 V1090" class="flow"/><text x="1935" y="1185" class="label">Phục vụ và quản lý tệp media</text>

  <!-- Legend -->
  <g transform="translate(620 1450)">
    <line x1="0" y1="30" x2="145" y2="30" class="flow"/><text x="170" y="37" class="label" text-anchor="start">Luồng giao tiếp chính</text>
    <line x1="610" y1="30" x2="755" y2="30" class="async"/><text x="780" y="37" class="label" text-anchor="start">Tác vụ nền / hàng đợi</text>
    <line x1="1200" y1="30" x2="1345" y2="30" class="ai"/><text x="1370" y="37" class="label" text-anchor="start">Kết nối mô hình AI</text>
  </g>
  <text x="1500" y="1650" class="caption">Hình 3.15. Sơ đồ triển khai hệ thống NotebookE</text>
</svg>
